<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>진단키트 업로드 - 촬영 전</title>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>12:30</span>
      <div class="statusbar-icons">
        <span>▮▮▮</span>
        <span>⌁</span>
        <span>▮</span>
      </div>
    </div>
    <div class="header">
      <button class="btn-back" aria-label="뒤로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.27832 11.7779L13.6559 6L15 7.44422L10.2945 12.5L15 17.5558L13.6559 19L8.27832 13.2221C8.10011 13.0306 8 12.7708 8 12.5C8 12.2292 8.10011 11.9694 8.27832 11.7779Z" fill="#1B1B1C"/></svg>
      </button>
    </div>
    <div class="content">
      <div class="steps">
        <div class="step inactive">1</div>
        <div class="step inactive">2</div>
        <div class="step inactive">3</div>
        <div class="step active">4</div>
      </div>
      <div style="margin-top:28px">
        <div class="title">진단키트 결과를 촬영해 주세요.</div>
        <div class="desc">사전 배포된 진단키트의 결과를<br>촬영하고 업로드해 주세요.</div>
        <div class="card">
          <div class="card-label">진단키트 사진</div>

          </div>
        </div>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-prev">이전</button>
      <button class="btn btn-next">다음</button>
    </div>
    <div class="navbar">
      <div class="nav-item">≡</div>
      <div class="nav-item">□</div>
      <div class="nav-item">‹</div>
    </div>
  </div>

</html>
