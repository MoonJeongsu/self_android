<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="admin-styles.css">
  <title>진단키트 등록 - 화면 흐름</title>
</head>
<body>
  <div class="flow-page">
    <h1 class="flow-title">관리자 — 진단키트 등록 화면 흐름</h1>
    <div class="flow-diagram">
      <div class="flow-box">
        <h4>자가진단 현황</h4>
        <p>GNB 메뉴에서<br>「진단키트 등록」<br>선택</p>
      </div>
      <div class="flow-arrow">→</div>
      <div class="flow-box highlight">
        <h4>진단키트 등록 (리스트)</h4>
        <p>등록 내역 테이블<br>필터: 성별, 등록일, 성명<br>「확인」 클릭</p>
      </div>
      <div class="flow-arrow">→</div>
      <div class="flow-box highlight">
        <h4>진단키트 등록 (상세)</h4>
        <p>등록 정보 확인<br>업로드된 키트 사진<br>썸네일 클릭 → 확대</p>
      </div>
    </div>
  </div>
</body>
</html>
